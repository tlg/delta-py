[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elium-delta"
version = "0.0.1"
description = "Rich text OT deltas with semantic cut/paste moves (quill-delta lineage)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Whatever SA" }]
maintainers = [{ name = "Antoine Perdaens", email = "a.perdaens@whatever-company.com" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["delta"]
